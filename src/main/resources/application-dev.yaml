spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

  threads:
    virtual:
      enabled: true

  application:
    name: CoHab

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/${COHAB_DB}
    username: ${COHAB_DB_USER}
    password: ${COHAB_DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${SHOW_SQL}
    properties:
      hibernate:
        format_sql: ${SHOW_SQL}
        dialect: org.hibernate.dialect.PostgreSQLDialect

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: public
    contexts: dev

  data:
    redis:
      timeout: 60000
      port: 6379
      host: localhost

server:
  port: ${COHAB_SERVER_PORT}
  address: 0.0.0.0

logging:
  level:
    org.springframework.security: ${LOGGING_LEVEL}
    by.magofrays: ${LOGGING_LEVEL}
    org.apache.kafka: INFO

user:
  max-families: 5

family:
  admin-role-name: ADMIN
  admin-role-value: 100
  user-role-name: MEMBER
  user-role-value: 10
  max-member-num: 20

kafka:
  topics:
    notification: "notification"

redis:
  cache:
    ttl: ${JWT_EXPIRES_AT}

security:
  jwt:
    public-key: classpath:certs/public.pem
    private-key: classpath:certs/private.pem
    expires-at: ${JWT_EXPIRES_AT}
  cors:
    allowed-origins: ${ALLOWED_ORIGINS}
    allowed-methods: ${ALLOWED_METHODS}
    allowed-headers: "*"
    allow-credentials: true
    max-age: 3600