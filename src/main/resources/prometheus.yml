global:
  scrape_interval: 5s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "cohab-family"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cohab-family:8080"]
      - labels:
          application: "cohab-family"
          environments: "production"

  - job_name: "cohab-chat"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["cohab-chat:8081"]
      - labels:
          application: "cohab-chat"
          environments: "production"
