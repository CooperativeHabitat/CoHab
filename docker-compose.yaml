services:
  cohab-db:
    image: 'postgres:16-alpine'
    container_name: cohab-db
    environment:
      - POSTGRES_DB=${COHAB_DB}
      - POSTGRES_PASSWORD=${COHAB_DB_PASSWORD}
      - POSTGRES_USER=${COHAB_DB_USER}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - cohab-network

  kafka1:
    image: apache/kafka:4.0.2
    container_name: ${KAFKA_DOMAIN_1}
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_DOMAIN_1:-localhost}:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - cohab-network

  mongodb:
    image: mongo:7.0
    container_name: ${MONGO_CONTAINER_NAME}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - "127.0.0.1:${MONGO_PORT}:${MONGO_PORT}"
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - cohab-network

  redis:
    image: redis:7.2-alpine
    container_name: cohab-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data
    networks:
      - cohab-network

  event-db:
    image: timescale/timescaledb:2.26.0-pg16
    container_name: ${EVENT_DB_CONTAINER_NAME}
    ports:
      - "127.0.0.1:${EVENT_DB_PORT}:${EVENT_DB_PORT}"
    environment:
      POSTGRES_USER: ${EVENT_DB_USER}
      POSTGRES_PASSWORD: ${EVENT_DB_PASSWORD}
      POSTGRES_DB: ${EVENT_DB}
      POSTGRES_PORT: ${EVENT_DB_PORT}
    volumes:
      - event_data:/var/lib/postgresql/data
    command: postgres -p ${EVENT_DB_PORT}
    restart: always
    networks:
      - cohab-network

  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: cohab-prometheus
    volumes:
      - ./src/main/resources/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - '9090:9090'
    depends_on:
      cohab-family:
        condition: service_started
      cohab-chat:
        condition: service_started
    restart: unless-stopped
    networks:
      - cohab-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: cohab-grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    ports:
      - '3000:3000'
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - cohab-network


  cohab-family:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cohab-family
    environment:
      - COHAB_DB=${COHAB_DB}
      - COHAB_DB_PASSWORD=${COHAB_DB_PASSWORD}
      - COHAB_DB_USER=${COHAB_DB_USER}
      - COHAB_DB_CONTAINER_NAME=${COHAB_DB_CONTAINER_NAME}
      - COHAB_DB_PORT=${COHAB_DB_PORT}
      - JWT_EXPIRES_AT=${JWT_EXPIRES_AT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ALLOWED_METHODS=${ALLOWED_METHODS}
      - COHAB_SERVER_PORT=${COHAB_SERVER_PORT}
      - LOGGING_LEVEL=${LOGGING_LEVEL}
      - SHOW_SQL=${SHOW_SQL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - REDIS_CONTAINER_NAME=${REDIS_CONTAINER_NAME}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT}
      - REDIS_PORT=${REDIS_PORT}
    ports:
      - 127.0.0.1:${COHAB_SERVER_PORT}:8080
    volumes:
      - ./src/main/resources:/app/src/main/resources:ro
    depends_on:
      - cohab-db
      - kafka1
      - redis
    networks:
      - cohab-network

  cohab-chat:
    build:
      context: ../CoHab-chat/
      dockerfile: Dockerfile
    container-name: cohab-chat
    ports:
      - 127.0.0.1:${COHAB_CHAT_PORT}:8081
      - 127.0.0.1:7000:7000
    environment:
      - EVENT_DB=${EVENT_DB}
      - EVENT_DB_PASSWORD=${EVENT_DB_PASSWORD}
      - EVENT_DB_USER=${EVENT_DB_USER}
      - EVENT_DB_PORT=${EVENT_DB_PORT}
      - EVENT_DB_CONTAINER_NAME=${EVENT_DB_CONTAINER_NAME}
      - JWT_EXPIRES_AT=${JWT_EXPIRES_AT}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ALLOWED_METHODS=${ALLOWED_METHODS}
      - COHAB_CHAT_PORT=${COHAB_CHAT_PORT}
      - LOGGING_LEVEL=${LOGGING_LEVEL}
      - SHOW_SQL=${SHOW_SQL}
      - KAFKA_BOOTSTRAP_SERVERS=${KAFKA_BOOTSTRAP_SERVERS}
      - REDIS_CONTAINER_NAME=${REDIS_CONTAINER_NAME}
      - REDIS_TIMEOUT=${REDIS_TIMEOUT}
      - REDIS_PORT=${REDIS_PORT}
      - MONGO_CONTAINER_NAME=${MONGO_CONTAINER_NAME}
      - MONGO_PORT=${MONGO_PORT}
      - MONGO_DB=${MONGO_DB}
      - MONGO_USER=${MONGO_USER}
      - MONGO_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - ./src/main/resources/certs/public.pem:/app/src/main/resources/certs/public.pem
    networks:
      - cohab-network


  cohab-front:
    build:
      context: ../CoHab-frontend/
      dockerfile: Dockerfile
    container-name: cohab-front
    ports:
      - 127.0.0.1:${OUTER_FRONTEND_PORT}:80
    depends_on:
      - cohab-family
      - cohab-chat
    networks:
      - cohab-network

volumes:
  kafka_data:
    name: cohab_kafka_data
  postgres_data:
    name: cohab_postgres_data
  event_data:
    name: cohab_event_data
  mongodb_data:
    name: cohab_mongodb_data
  redis_data:
    name: cohab_redis_data
  prometheus_data:
    name: cohab_prometheus_data
  grafana_data:
    name: grafana_data

networks:
  cohab-network:
    name: cohab-network
    driver: bridge
